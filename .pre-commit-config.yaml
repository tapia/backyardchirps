repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        exclude: 'backyardchirps/species_data/taxonomy/birdnet_taxonomy\.json'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: [--severity=style]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy backyardchirps
        language: system
        types: [python]
        pass_filenames: false

      - id: compilemessages
        name: compilemessages
        entry: uv run python manage.py compilemessages --ignore .venv --ignore frontend
        language: system
        files: \.po$
        pass_filenames: false

      - id: eslint
        name: eslint
        entry: frontend/node_modules/.bin/eslint
        language: system
        types_or: [javascript, vue]
        files: ^frontend/

      - id: prettier
        name: prettier
        entry: frontend/node_modules/.bin/prettier
        args: [--write]
        language: system
        types_or: [javascript, vue, css, json]
        files: ^frontend/
        exclude: ^frontend/(dist|node_modules)/

      # Catches a translated string vue-i18n cannot compile, which is valid JavaScript
      # and so invisible to eslint, prettier and the build. See scripts/check-locales.mjs.
      - id: check-locales
        name: check locale messages
        entry: node frontend/scripts/check-locales.mjs
        language: system
        files: ^frontend/src/locales/
        pass_filenames: false
