server {
    listen 80;
    # apply.sh removes the stock default site, so this is the only server block on
    # port 80 and nginx uses it for every request whatever the Host header says.
    # Naming a host here would change nothing, so it names none.
    server_name _;

    # ── Frontend SPA ──────────────────────────────────────────────────────────
    root APP_DIR/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Django admin static files ─────────────────────────────────────────────
    location /static/ {
        alias __DATA_DIR__/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Django API, admin, and media endpoints ────────────────────────────────
    location ~ ^/(api|admin|species-data)/ {
        proxy_pass http://unix:/run/backyardchirps-web/gunicorn.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;

        # Larger buffer for audio clip responses
        proxy_buffers 8 64k;
        proxy_buffer_size 64k;
    }
}
