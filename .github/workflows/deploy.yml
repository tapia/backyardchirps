name: Deploy

# Put every commit on main onto the deploy Pi, through apt and the published repository.
#
# This is the path an owner's station will take, exercised on real hardware before anyone
# else is told the repository exists. Nothing is built here and nothing is copied to the
# Pi: the packages were built, signed and published by the Publish workflow, and this
# station installs them the way a stranger's would.
#
# The trigger is Publish rather than CI, because the thing being deployed is a package that
# does not exist until Publish has made it. CI is still the gate: the job below waits for
# the CI run over the same commit and refuses to deploy a commit CI rejected.
#
# The branches filter is not enough on its own. It matches the head branch of whatever
# triggered Publish, and a pull request from a fork carries its own branch name, which is
# `main` by default. The head_repository check is what actually keeps this to code that
# came from here. That matters because the second job runs on a self-hosted runner, meaning
# a Raspberry Pi in somebody's home.
#
# Nothing is checked out on the Pi, and that stays true: adding an actions/checkout step to
# the deploy job would put a contributor's code on the station.
on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  # The suite carrying per-commit builds. The keyring package ships a source file naming
  # `stable`, which is releases only; this Pi reads a second file, owned by no package, so
  # an upgrade of the keyring can never move it back to stable.
  SUITE: main
  MAIN_SOURCE: /etc/apt/sources.list.d/backyardchirps-main.sources

jobs:
  check:
    name: Wait for CI and work out the version
    runs-on: ubuntu-latest
    # Pushes only. Publish is also reachable by hand and from the nightly taxonomy job, and
    # neither of those builds a per-commit app package, so a deploy triggered by one would sit
    # waiting for a version nothing was ever going to publish.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # The exact commit Publish built, not whatever main points at now.
      #
      # fetch-depth 0, because the version below counts commits and a shallow clone answers 1.
      # The version composer refuses one rather than handing back a number that means nothing.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # Publish does not depend on CI, so without this a commit that fails the suite would
      # reach the station anyway. Publish takes several minutes and CI about one, so this
      # almost always finds a finished run on the first look; the loop is for the times it
      # does not.
      - name: Refuse to deploy a commit CI has not passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            run="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion // "")"' 2> /dev/null || true)"
            status="${run%% *}"
            conclusion="${run#* }"
            case "$status" in
              completed)
                if [ "$conclusion" = success ]; then
                  echo "CI passed for $SHA"
                  exit 0
                fi
                echo "CI concluded '$conclusion' for $SHA, so nothing is deployed." >&2
                exit 1
                ;;
              '')
                echo "attempt $attempt: no CI run for $SHA yet"
                ;;
              *)
                echo "attempt $attempt: CI is $status"
                ;;
            esac
            sleep 20
          done
          echo "CI never reported for $SHA within ten minutes." >&2
          exit 1

      # Nothing is synced. The step below reads pyproject.toml and the git history and
      # nothing else, and uv is here so that it runs under the same interpreter Publish uses.
      - uses: astral-sh/setup-uv@v5

      # Asked of the same code Publish asked, rather than composed again here. This job used
      # to build the string itself from pyproject.toml and the commit sha, which is the same
      # rule written twice: the moment Publish's copy changed, this one asked the Pi for a
      # version that had never existed and the install failed with "not found".
      #
      # Worked out here rather than on the Pi because it needs the tree, and the Pi never has
      # one.
      - id: version
        name: Work out the version Publish built
        run: |
          set -euo pipefail
          version="$(uv run --no-project python tools/build_packages.py --print-main-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "deploying $version"

  deploy:
    name: Install it on the Raspberry Pi
    needs: check
    runs-on: self-hosted
    env:
      APT_BASE_URL: ${{ vars.APT_BASE_URL }}
      VERSION: ${{ needs.check.outputs.version }}

    steps:
      # This station is taken over by hand, once, and never by a workflow: installing the
      # keyring package is a decision about what the machine trusts, and it is not one a
      # job triggered from GitHub should be making on its own. See
      # docs/devel/deployment.md.
      - name: Check the station is on apt at all
        run: |
          set -euo pipefail
          if [ ! -e /usr/share/keyrings/backyardchirps-archive-keyring.gpg ]; then
            echo "This Pi does not trust the archive yet, so nothing can be installed." >&2
            echo "Take it over by hand once: see 'Moving the deploy Pi onto apt' in" >&2
            echo "docs/devel/deployment.md." >&2
            exit 1
          fi
          if [ -e /opt/backyardchirps/current ]; then
            echo "This Pi still has a station installed from a release tarball." >&2
            echo "The packages refuse to install over one until the takeover exists." >&2
            echo "See 'Moving the deploy Pi onto apt' in docs/devel/deployment.md." >&2
            exit 1
          fi

      # Rewritten every deploy rather than checked, so a change of host or suite arrives
      # with the next push instead of needing somebody to remember. No package owns this
      # file, which is what keeps an upgrade of the keyring package from resetting this
      # station to the stable suite.
      - name: Point the station at the main suite
        run: |
          set -euo pipefail
          if [ -z "$APT_BASE_URL" ]; then
            echo "vars.APT_BASE_URL is not set. See docs/devel/debian-packaging.md." >&2
            exit 1
          fi
          sudo tee "$MAIN_SOURCE" > /dev/null <<EOF
          # Written by .github/workflows/deploy.yml. Owned by no package on purpose.
          Types: deb
          URIs: $APT_BASE_URL
          Suites: $SUITE
          Components: main
          Architectures: arm64
          Signed-By: /usr/share/keyrings/backyardchirps-archive-keyring.gpg
          EOF
          sudo chmod 644 "$MAIN_SOURCE"

      # Only our own source, for the reason a station's updater will scope its own: a dead
      # repository must never break the owner's unrelated apt upgrade, and refreshing all of
      # Debian on every push is minutes this job does not need to spend.
      #
      # Retried, because Publish returning is not the same as the content having reached the
      # edge the Pi reads from.
      - name: Wait for the version to reach this station
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            sudo apt-get update -qq \
              -o Dir::Etc::sourcelist="$MAIN_SOURCE" \
              -o Dir::Etc::sourceparts=/dev/null \
              -o APT::Get::List-Cleanup=0
            if apt-cache show "backyardchirps=$VERSION" > /dev/null 2>&1; then
              echo "$VERSION is offered, after $attempt attempt(s)"
              exit 0
            fi
            echo "attempt $attempt: the repository does not offer $VERSION yet"
            sleep 30
          done
          echo "$VERSION never appeared in the $SUITE suite." >&2
          apt-cache madison backyardchirps >&2 || true
          exit 1

      # The exact version, so the station runs the commit that triggered this run and not a
      # newer one that landed while it was waiting. --allow-downgrades because a build off
      # main can sort below what is installed when a run finishes out of order, and this Pi
      # is meant to be showing what the tested commit does.
      #
      # --force-confold and --force-confdef, because a conffile prompt has nobody to answer it
      # and would hang the job forever. The two conffiles are the nginx site and
      # /etc/default/backyardchirps, neither edited here.
      #
      # Deliberately no `sudo DEBIAN_FRONTEND=noninteractive`. Debian's sudoers resets the
      # environment, and setting a variable across sudo needs a SETENV tag the runner's grant
      # does not carry, so that form fails outright rather than quietly. Nothing here uses
      # debconf, and the two force options are what actually keeps dpkg from asking.
      - name: Install it
        run: |
          set -euo pipefail
          sudo apt-get install -y \
            -o Dpkg::Options::=--force-confold \
            -o Dpkg::Options::=--force-confdef \
            --allow-downgrades \
            "backyardchirps=$VERSION"

      # dpkg unpacks in place, so unlike the symlink swap this replaces there is no version
      # of this that cannot fail half way. What the station says about itself afterwards is
      # the only thing that settles whether the deploy worked.
      - name: Check the station came back
        run: |
          set -euo pipefail
          installed="$(dpkg-query -W -f='${Version}' backyardchirps)"
          if [ "$installed" != "$VERSION" ]; then
            echo "apt installed $installed rather than $VERSION." >&2
            exit 1
          fi
          systemctl is-active --quiet backyardchirps-web
          curl -fsS -o /dev/null http://localhost/
          echo "$VERSION is live, and the site answers."
          # Reported rather than asserted: the recorder stays stopped until the wizard is
          # finished, so a station nobody has set up yet is not a failed deploy.
          echo "recorder: $(systemctl is-active backyardchirps-recorder || true)"
