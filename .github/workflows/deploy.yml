name: Deploy

# Deploy only after the CI workflow finishes, and only for CI runs that succeeded on
# this repository's own main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Raspberry Pi
    runs-on: self-hosted
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Deploy latest code
        run: ~/backyardchirps/deploy/deploy.sh
