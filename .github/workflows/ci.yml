name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Lint, type-check & test backend
    runs-on: ubuntu-latest
    env:
      # The settings module reads SECRET_KEY at import time; provide a throwaway
      # value so Django can start under CI (conftest also sets a default).
      SECRET_KEY: ci-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy backyardchirps

      - name: Pytest
        run: uv run pytest

  frontend:
    name: Lint & build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npx eslint src --quiet

      - name: Prettier
        working-directory: frontend
        run: npx prettier --check src

      # A translated string that vue-i18n cannot compile is valid JavaScript, so
      # nothing above sees it. It only fails when something renders it, and it takes
      # the component down with it: a piece of the page missing on a station, with
      # every check here green.
      - name: Locale messages
        working-directory: frontend
        run: npm run check:locales

      # The release ships the frontend prebuilt, so a build that does not compile
      # would only be found when a tag is pushed.
      - name: Build
        working-directory: frontend
        run: npm run build

  shell:
    name: Lint shell scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # install.sh is what every user runs first, as root, so it is checked at the
      # same severity as the rest of the tree.
      - name: ShellCheck
        run: |
          shellcheck --severity=style \
            install.sh uninstall.sh deploy/*.sh
