# Install a release onto a clean machine and check what came out.
#
# The backend job in ci.yml tests the code. This tests the thing that puts the
# code on a Pi, which no unit test can reach: paths, permissions, the service
# user, systemd units, the nginx site, migrations against an empty database, and
# the uninstall. It is the only job where tools/build_tarball.py, install.sh,
# deploy/apply.sh and uninstall.sh run together.
#
# Slow on purpose, so it stays off most pushes: it builds a real tarball, resolves
# every Python dependency, and downloads the BirdNET acoustic model. The path
# filters keep it to changes that could break an install. They are written out
# twice because GitHub Actions does not support YAML anchors, so the two lists
# have to be kept in step by hand.
name: Installer

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - uninstall.sh
      - deploy/**
      - tools/build_tarball.py
      - tools/container/**
      - backyardchirps/settings/**
      - pyproject.toml
      - uv.lock
      - .python-version
      - frontend/package-lock.json
      - .github/workflows/installer.yml
  pull_request:
    paths:
      - install.sh
      - uninstall.sh
      - deploy/**
      - tools/build_tarball.py
      - tools/container/**
      - backyardchirps/settings/**
      - pyproject.toml
      - uv.lock
      - .python-version
      - frontend/package-lock.json
      - .github/workflows/installer.yml
  workflow_dispatch:

# Pushing again to a branch makes the earlier run pointless, and this job is
# expensive enough that finishing it anyway is a waste.
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install a staged release on a clean machine
    # arm64, because that is what a Pi is. An installer is the one thing that
    # cannot be trusted from a different architecture: this is where Python
    # wheels either resolve for the target or do not.
    #
    # Free for public repositories. On a private one this label finds no runner
    # and the job queues until it times out, so switch it to ubuntu-latest and
    # accept that wheel resolution is no longer being tested.
    runs-on: ubuntu-24.04-arm
    # Generous: most of the time is the uv syncs and one model download, all over
    # the network, and a slow mirror should not read as a broken installer. The run
    # installs twice, since it also tests updating a station to a newer release. The
    # second install is the cheaper one: the model is already in the data directory
    # and the uv cache is warm, so it builds a virtualenv and little else.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # The tarball builder is Python, and it runs with --no-project, so this needs
      # uv for the interpreter alone. Nothing is synced: a build resolves no
      # dependencies, and the container installs its own from the release.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Only the tarball build needs Node, and only out here. The container never
      # gets it, which is what proves a station does not need it either.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Docker comes with the runner image, so nothing has to be installed for this.
      #
      # On failure the script prints the tail of the station's install log, so the
      # reason is in this job's output rather than inside a container that is
      # already gone.
      - name: Install a release and check it
        # --no-project because the test needs nothing the station installs, only pytest
        # itself. The coverage report and the Django settings the project suite asks for
        # stay out of the way through tools/container/pytest.ini. -s lets the fixtures say
        # which slow step they are on while they are on it.
        run: >
          uv run --no-project --with pytest pytest
          tools/container -v -s
