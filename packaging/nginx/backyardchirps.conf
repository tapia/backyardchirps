server {
    # A station answers on whatever name it is reached by: <hostname>.local, a LAN
    # address, or a domain in front of a tunnel. Rather than list those, this block
    # claims the default: `_` matches no hostname, and `default_server` is what makes
    # it serve the requests that match nothing else.
    #
    # Saying default_server rather than relying on being the only block is the point.
    # It used to be implicit, and a leftover site from an older install then beat it
    # by naming `localhost` outright, because an exact name match wins over the
    # default. That served a station its predecessor's dead document root. If some
    # other site ever claims default_server too, `nginx -t` fails and takes the
    # deploy down with it, which is the loud version of the same problem.
    listen 80 default_server;
    server_name _;

    # ── Frontend SPA ──────────────────────────────────────────────────────────
    root /usr/share/backyardchirps/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the hashed bundles, so a browser holding an old copy runs an old
    # app against a new backend, and every call to a route that has been renamed comes
    # back 404 with nothing to say it is a stale page. Nothing in a deploy can reach into
    # a browser to fix that, so the page has to refuse to be cached in the first place.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The bundles are content-hashed, so a changed file always has a new name and an old
    # name is never reused. They can be kept for as long as a browser likes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Django admin static files ─────────────────────────────────────────────
    location /static/ {
        alias /usr/share/backyardchirps/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Microphone level meter ────────────────────────────────────────────────
    # One long response that pushes a reading ten times a second while the wizard's
    # microphone step is open. Buffering would collect those and deliver them in bursts,
    # so the bar would jump instead of following the sound. It is off here and only here:
    # the block below wants the opposite for audio clips.
    #
    # An exact location wins over the regex below whatever the order, but it is written
    # above it anyway, since reading these in order is how anyone works out what serves
    # what.
    location = /setup/audio-level/ {
        proxy_pass http://unix:/run/backyardchirps-web/gunicorn.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Only ever waits on the gap between readings, which is a tenth of a second. It
        # is the first one that can take a moment, while the device opens.
        proxy_read_timeout 30;
    }

    # ── Django API, admin, setup wizard, and media endpoints ──────────────────
    # The setup wizard is server-rendered rather than part of the SPA, so /setup/
    # has to reach Django instead of falling through to index.html.
    location ~ ^/(api|admin|setup|species-data)/ {
        proxy_pass http://unix:/run/backyardchirps-web/gunicorn.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;

        # Larger buffer for audio clip responses
        proxy_buffers 8 64k;
        proxy_buffer_size 64k;
    }
}
