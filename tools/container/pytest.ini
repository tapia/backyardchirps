# The container suite's own configuration, so that it stops inheriting the project's.
#
# pytest reads exactly one of these, the nearest one above the paths it was given, so this
# file makes tools/container the rootdir and pyproject.toml's [tool.pytest.ini_options]
# stops applying here. Two things follow from that, and both were bugs.
#
# DJANGO_SETTINGS_MODULE is not set any more, so pytest-django stays asleep. When it is
# set, the plugin imports the settings before collection, they read SECRET_KEY out of the
# environment, and the run dies before a single test starts. Nothing here imports the
# project: these tests talk to a machine in a container. It only bites when a project
# virtualenv exists beside them, which is exactly what the package build leaves behind
# when it compiles the message catalogs.
#
# addopts is empty, so a container run no longer asks for a coverage report on a package it
# never imports, and cannot overwrite coverage.xml.
[pytest]
